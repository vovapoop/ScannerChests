# Лёгкий профиль линтера для CI.
# Выбраны категоричные правила: ошибки синтаксиса (E4/E7/E9),
# неиспользуемый код (F) и сортировка импортов (I).
# Полный набор правил безопасности (BLE, S, SIM) намеренно отключён:
# проект — локальное GUI-приложение с широкими try/except по краям.

[lint]
select = ["E4", "E7", "E9", "F", "I"]
# Однострочные instructions (E701/E702) — стиль существующего кода
# (обработка клавиш в калибровке, чекпоинты Discord).
ignore = ["E701", "E702"]

[lint.per-file-ignores]
# Импорты зависимостей в бутстрапе нужны для ранней проверки доступности.
"chest_scanner/app_bootstrap.py" = ["F401"]